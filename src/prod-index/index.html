<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Junta de Agua</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Content-Security-Policy (FASE 4). Solo en el build de producción:
       - 'unsafe-inline' en style-src: PrimeNG inyecta estilos por JS.
       - connect-src: 'self' (API misma-origin vía nginx) + backend local dev.
       - frame-ancestors 'none': anti-clickjacking (equivale a X-Frame-Options: DENY). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://backend-junta-agua-hn.onrender.com http://localhost:4000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
