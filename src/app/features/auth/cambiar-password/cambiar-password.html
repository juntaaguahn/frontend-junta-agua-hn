<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Cambiar Contraseña</h1>
      <p class="page-subtitle">Actualiza tu contraseña de acceso al sistema</p>
    </div>
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      severity="secondary"
      text
      rounded
      (onClick)="volver()"
    />
  </header>

  @if (error()) {
    <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
  }
  @if (exito()) {
    <p-message severity="success" [text]="exito()" styleClass="w-full mb-3" />
  }

  <form (ngSubmit)="onSubmit()" class="card cambiar-pw-form">
    <div class="campo">
      <label for="actual">Contraseña actual <span class="req">*</span></label>
      <p-password
        id="actual"
        name="actual"
        [(ngModel)]="actual"
        [toggleMask]="true"
        [feedback]="false"
        [fluid]="true"
      />
    </div>

    <div class="campo">
      <label for="nueva">Nueva contraseña <span class="req">*</span></label>
      <p-password
        id="nueva"
        name="nueva"
        [(ngModel)]="nueva"
        [toggleMask]="true"
        [feedback]="true"
        [fluid]="true"
      />
      <ul class="pw-rules">
        @for (v of validaciones; track v.label) {
          <li [class.ok]="v.ok" [class.fail]="!v.ok && nueva.length > 0">
            <i [class]="v.ok ? 'pi pi-check-circle' : 'pi pi-circle'"></i>
            {{ v.label }}
          </li>
        }
      </ul>
    </div>

    <div class="campo">
      <label for="confirmar">Confirmar nueva contraseña <span class="req">*</span></label>
      <p-password
        id="confirmar"
        name="confirmar"
        [(ngModel)]="confirmar"
        [toggleMask]="true"
        [feedback]="false"
        [fluid]="true"
      />
    </div>

    <div class="acciones-form">
      <p-button
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        severity="secondary"
        (onClick)="volver()"
      />
      <p-button
        type="submit"
        label="Actualizar contraseña"
        icon="pi pi-check"
        [disabled]="!valido"
        [loading]="guardando()"
      />
    </div>
  </form>
</section>
