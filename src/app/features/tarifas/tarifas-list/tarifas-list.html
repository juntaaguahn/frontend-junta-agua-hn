<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Tarifas</h1>
      <p class="page-subtitle">Administración de tarifas del servicio de agua potable</p>
    </div>
    <p-button label="Nueva tarifa" icon="pi pi-plus" rounded (onClick)="nuevo()" />
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Concepto, descripción o unidad..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
      />
    </div>
    <div class="campo">
      <label>Estado</label>
      <p-select
        [options]="estadoOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="estadoFiltro()"
        (onChange)="estadoFiltro.set($event.value); buscar()"
        placeholder="Todos"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        text
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <p-dataview
    [value]="filtered()"
    [loading]="cargando()"
    dataKey="id"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
  >
    <ng-template #list let-items>
      <div class="dv-cards">
        @for (t of items; track t.id) {
          <div
            class="dv-card"
            (click)="ver(t.id)"
            role="button"
            tabindex="0"
            (keydown.enter)="ver(t.id)"
          >
            <div class="dv-top">
              <span class="dv-title">{{ t.concepto }}</span>
              <p-tag [value]="t.estado" [severity]="severityFor(t.estado)" />
            </div>

            <div class="dv-body">
              <div class="dv-row">
                <span class="dv-label">Descripción</span>
                <span class="dv-value">{{ t.descripcion || '-' }}</span>
              </div>
              <div class="dv-row">
                <span class="dv-label">Valor</span>
                <span class="dv-value dv-monto">L {{ t.valor | number: '1.2-2' }}</span>
              </div>
              <div class="dv-row">
                <span class="dv-label">Unidad</span>
                <span class="dv-value">{{ t.unidad || '-' }}</span>
              </div>
            </div>

            <div class="dv-actions" (click)="$event.stopPropagation()">
              <p-button
                icon="pi pi-eye"
                pTooltip="Ver"
                (onClick)="ver(t.id)"
                severity="info"
                text
                rounded
              />
              <p-button
                icon="pi pi-pencil"
                pTooltip="Editar"
                (onClick)="editar(t.id, $event)"
                severity="warn"
                text
                rounded
              />
              <p-button
                icon="pi pi-trash"
                pTooltip="Eliminar"
                (onClick)="eliminar(t, $event)"
                severity="danger"
                text
                rounded
              />
            </div>
          </div>
        }
      </div>
    </ng-template>

    <ng-template #emptymessage>
      <div class="text-center p-3">No hay tarifas que coincidan con los filtros.</div>
    </ng-template>
  </p-dataview>
</section>
