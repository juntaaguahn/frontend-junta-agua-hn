<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ titulo() }}</h1>
      <p class="page-subtitle">Datos de la tarifa del servicio de agua</p>
    </div>
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      severity="secondary"
      text
      rounded
      (onClick)="volver()"
    />
  </header>

  @if (cargando()) {
    <div class="card">Cargando datos...</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="guardar()" class="card form-grid">
      <div class="campo">
        <label for="concepto">Concepto <span class="req">*</span></label>
        <input
          pInputText
          id="concepto"
          formControlName="concepto"
          maxlength="40"
          [ngClass]="{ 'ng-invalid': invalid('concepto') }"
        />
        @if (invalid('concepto')) {
          <small class="err">El concepto es obligatorio (máx. 40 caracteres)</small>
        }
      </div>

      <div class="campo">
        <label for="unidad">Unidad</label>
        <input
          pInputText
          id="unidad"
          formControlName="unidad"
          maxlength="20"
          placeholder="m³, unidad, global..."
        />
      </div>

      <div class="campo">
        <label for="valor">Valor <span class="req">*</span></label>
        <p-inputNumber
          id="valor"
          formControlName="valor"
          [min]="0"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [ngClass]="{ 'ng-invalid': invalid('valor') }"
          styleClass="w-full"
        />
        @if (invalid('valor')) {
          <small class="err">El valor es obligatorio y debe ser mayor a 0</small>
        }
      </div>

      <div class="campo">
        <label for="estado">Estado <span class="req">*</span></label>
        <p-select
          id="estado"
          formControlName="estado"
          [options]="estadoOptions"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
        />
      </div>

      <div class="campo campo-wide">
        <label for="descripcion">Descripción</label>
        <textarea
          pTextarea
          id="descripcion"
          formControlName="descripcion"
          rows="2"
          maxlength="120"
        ></textarea>
      </div>

      <div class="acciones-form">
        <p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          severity="secondary"
          (onClick)="volver()"
        />
        <p-button type="submit" label="Guardar" icon="pi pi-check" [loading]="guardando()" />
      </div>
    </form>
  }
</section>
