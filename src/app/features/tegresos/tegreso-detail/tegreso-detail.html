<section class="page">
  @if (cargando()) {
    <div class="card"><p-skeleton width="100%" height="2rem" styleClass="mb-3" /></div>
    <div class="card"><p-skeleton width="100%" height="8rem" /></div>
  } @else if (tegreso(); as t) {
    <header class="page-header">
      <div>
        <h1 class="page-title">{{ t.descripcion }}</h1>
        <p class="page-subtitle">
          Tipo de egreso
          <p-tag
            [value]="statusLabel(t.status)"
            [severity]="statusSeverity(t.status)"
            styleClass="ml-2"
          />
        </p>
      </div>
      <div>
        <p-button label="Editar" icon="pi pi-pencil" severity="warn" rounded (onClick)="editar()" />
        <p-button
          label="Volver"
          icon="pi pi-arrow-left"
          severity="secondary"
          text
          rounded
          (onClick)="volver()"
        />
      </div>
    </header>

    <div class="card ficha">
      <div class="ficha-item">
        <span class="lbl">Descripción</span>
        <span>{{ t.descripcion }}</span>
      </div>
      <div class="ficha-item">
        <span class="lbl">Estado</span>
        <span><p-tag [value]="statusLabel(t.status)" [severity]="statusSeverity(t.status)" /></span>
      </div>
    </div>
  }
</section>
